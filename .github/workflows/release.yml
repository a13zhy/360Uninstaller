name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（留空则按 app/constants.py 的 APP_VERSION 生成）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - app/constants.py

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $ver = (Select-String -Path app/constants.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "v$ver" }
          "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "release tag: $tag"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==6.12.0" "Pillow>=10.0.0" "pyinstaller==6.22.3"

      - name: Generate icons
        run: python tools/make_icon.py

      - name: Build single-file exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ResidualCleaner --icon assets/app_icon.ico --uac-admin --add-data "assets;assets" --exclude-module tkinter main.py

      - name: Package win64 and source
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.txt
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item RELEASE_NOTES.md dist/RELEASE_NOTES.md
          Compress-Archive -Path dist/ResidualCleaner.exe,dist/README.txt,dist/LICENSE.txt,dist/RELEASE_NOTES.md -DestinationPath "dist/ResidualCleaner-$env:TAG-win64.zip" -Force
          Compress-Archive -Path app,main.py,preview.py,requirements.txt,README.md,LICENSE,RELEASE_NOTES.md,build_exe.bat,run.bat,tools -DestinationPath "dist/ResidualCleaner-$env:TAG-src.zip" -Force
          Get-ChildItem dist | Select-Object Name,Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "dist/ResidualCleaner.exe",
            "dist/ResidualCleaner-$env:TAG-win64.zip",
            "dist/ResidualCleaner-$env:TAG-src.zip"
          )
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release exists, update assets"
            gh release upload "$env:TAG" @assets --clobber
            gh release edit "$env:TAG" --notes-file RELEASE_NOTES.md --latest
          } else {
            gh release create "$env:TAG" --title "$env:TAG" --notes-file RELEASE_NOTES.md --latest @assets
          }
